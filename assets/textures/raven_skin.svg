<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" shape-rendering="crispEdges">
    <!-- Hoodie -->
    <rect x="16" y="16" width="32" height="32" fill="#000000" />
    <rect x="16" y="16" width="32" height="32" fill="none" stroke="#333333" stroke-width="1" />
    <!-- Raven Emblem -->
    <path d="M32 24 L28 32 L32 40 L36 32 Z" fill="#8B0000" />
    <path d="M28 32 L32 24 L36 32 L32 40 Z" fill="#8B0000" />
    <!-- Hair -->
    <path d="M16 16 C20 12 24 12 28 16 C32 20 36 20 40 16 C44 12 48 12 52 16" stroke="#000000" stroke-width="2" fill="none" />
    <path d="M16 16 C20 12 24 12 28 16 C32 20 36 20 40 16 C44 12 48 12 52 16" stroke="#800020" stroke-width="1" fill="none" />
    <path d="M16 16 C20 12 24 12 28 16 C32 20 36 20 40 16 C44 12 48 12 52 16" stroke="#C0C0C0" stroke-width="1" fill="none" />
    <path d="M16 16 C20 12 24 12 28 16 C32 20 36 20 40 16 C44 12 48 12 52 16" stroke="#FFD700" stroke-width="1" fill="none" />
    <!-- Face -->
    <rect x="24" y="24" width="16" height="8" fill="#F5DEB3" />
    <rect x="24" y="24" width="16" height="8" fill="none" stroke="#000000" stroke-width="1" />
    <!-- Eyes -->
    <rect x="28" y="28" width="2" height="2" fill="#8B4513" />
    <rect x="34" y="28" width="2" height="2" fill="#8B4513" />
    <!-- Face Covering -->
    <rect x="24" y="32" width="16" height="8" fill="#000000" />
    <!-- Sleeves -->
    <rect x="12" y="16" width="4" height="32" fill="#000000" />
    <rect x="48" y="16" width="4" height="32" fill="#000000" />
    <rect x="12" y="16" width="4" height="32" fill="none" stroke="#FFFFFF" stroke-width="1" />
    <rect x="48" y="16" width="4" height="32" fill="none" stroke="#FFFFFF" stroke-width="1" />
    <!-- Trousers -->
    <rect x="20" y="48" width="24" height="16" fill="#4B0082" />
    <rect x="20" y="48" width="24" height="16" fill="none" stroke="#333333" stroke-width="1" />
    <!-- Shoes -->
    <rect x="20" y="64" width="8" height="4" fill="#000000" />
    <rect x="36" y="64" width="8" height="4" fill="#000000" />
    <rect x="20" y="64" width="8" height="4" fill="none" stroke="#FFFFFF" stroke-width="1" />
    <rect x="36" y="64" width="8" height="4" fill="none" stroke="#FFFFFF" stroke-width="1" />
</svg>